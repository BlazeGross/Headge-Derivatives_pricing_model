services:
  hedging-dashboard:
    image: ${APP_IMAGE:-hedging-derivatives-pricing:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    environment:
      HEDGING_DEMO_DATA: /app/dane_cross_hedge.csv
      PYTHONUNBUFFERED: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
